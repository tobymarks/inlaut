name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Before CodeQL starts tracing: Homebrew refuses to install under the tracer.
      - name: Prepare dependencies
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: swift
          build-mode: manual
      # The tracer starts the build as x86_64; the app only builds for arm64.
      - name: Build
        run: |
          arch -arm64 xcodebuild -project Inlaut.xcodeproj -scheme Inlaut \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: /language:swift
