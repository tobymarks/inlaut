name: Build and test
on:
  push:
    branches: [main]
    paths-ignore:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - 'design/**'
  pull_request:
    paths-ignore:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - 'design/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare dependencies
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Static analysis
        run: |
          command -v swiftlint || brew install swiftlint
          swiftlint lint --strict
      - name: Build and run isolated tests
        run: |
          xcodebuild -project Inlaut.xcodeproj -scheme Inlaut \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO test
      - name: Validate release scripts
        run: |
          bash -n scripts/release.sh
          python3 -m py_compile scripts/validate-appcast.py scripts/validate-dmg.py scripts/dmg-settings.py
          xcrun swift scripts/render-dmg-background.swift build/dmg-artwork
          git diff --exit-code -- Resources/Info.plist Resources/Inlaut.entitlements
