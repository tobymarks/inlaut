name: Build and test
on:
  push:
    branches: [main]
    paths-ignore:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - 'design/**'
  pull_request:
    paths-ignore:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - 'design/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR code runs below; the git credential stays out of .git/config.
          persist-credentials: false
      - name: Install pinned xcodegen and swiftlint
        # Homebrew would fetch whatever is current; a version and checksum
        # each keep the build reproducible and the supply chain small.
        run: |
          curl -fsSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.49.0/xcodegen.zip
          echo 'ae5598b33a19ad1e23e775d6648f97375c3529c970905f489358a21055b65e53  xcodegen.zip' | shasum -a 256 -c -
          unzip -q xcodegen.zip -d tools
          curl -fsSL -o swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          echo 'c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  swiftlint.zip' | shasum -a 256 -c -
          unzip -q swiftlint.zip -d tools/swiftlint-bin
          echo "$PWD/tools/xcodegen/bin" >> "$GITHUB_PATH"
          echo "$PWD/tools/swiftlint-bin" >> "$GITHUB_PATH"
      - name: Prepare dependencies
        run: xcodegen generate
      - name: Static analysis
        run: swiftlint lint --strict
      - name: Build and run isolated tests
        run: |
          xcodebuild -project Inlaut.xcodeproj -scheme Inlaut \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO test
      - name: Validate release scripts
        run: |
          bash -n scripts/release.sh
          python3 -m py_compile scripts/validate-appcast.py scripts/validate-dmg.py scripts/dmg-settings.py
          xcrun swift scripts/render-dmg-background.swift build/dmg-artwork
          git diff --exit-code -- Resources/Info.plist Resources/Inlaut.entitlements
