name: Windows Build

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build inlaut Windows App & Models
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore windows/Inlaut.sln

      - name: Build Solution
        run: dotnet build windows/Inlaut.sln -c Release --no-restore

      - name: Publish Inlaut.App (Self-Contained win-x64)
        run: >
          dotnet publish windows/src/Inlaut.App/Inlaut.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=false
          -o publish/inlaut-windows

      - name: Bundle German On-Device Model (FastConformer Transducer INT8)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "publish/inlaut-windows/models"
          $baseUrl = "https://huggingface.co/csukuangfj/sherpa-onnx-nemo-transducer-stt_de_fastconformer_hybrid_large_pc-int8/resolve/main"
          Write-Host "Downloading German FastConformer Transducer tokens..."
          Invoke-WebRequest -Uri "$baseUrl/tokens.txt" -OutFile "publish/inlaut-windows/models/tokens.txt"
          Write-Host "Downloading German FastConformer Transducer encoder (131 MB)..."
          Invoke-WebRequest -Uri "$baseUrl/encoder.int8.onnx" -OutFile "publish/inlaut-windows/models/encoder.int8.onnx"
          Write-Host "Downloading German FastConformer Transducer decoder (4 MB)..."
          Invoke-WebRequest -Uri "$baseUrl/decoder.int8.onnx" -OutFile "publish/inlaut-windows/models/decoder.int8.onnx"
          Write-Host "Downloading German FastConformer Transducer joiner (1.4 MB)..."
          Invoke-WebRequest -Uri "$baseUrl/joiner.int8.onnx" -OutFile "publish/inlaut-windows/models/joiner.int8.onnx"

      - name: Copy Documentation
        shell: pwsh
        run: |
          Copy-Item "windows/README.md" -Destination "publish/inlaut-windows/"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inlaut-windows-app
          path: publish/inlaut-windows/
          retention-days: 14
