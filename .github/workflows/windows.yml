name: Windows Build

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - '.gitattributes'
      - 'global.json'
      - 'TestData/**'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - '.gitattributes'
      - 'global.json'
      - 'TestData/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build inlaut Windows App & Models
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet --info
          dotnet restore windows/Inlaut.sln

      - name: Build Solution
        run: dotnet build windows/Inlaut.sln -c Release --no-restore

      - name: Text preservation regression
        run: dotnet run --project windows/tests/Inlaut.CoreSmoke -c Release

      - name: Simulated dictation and failure recovery
        run: dotnet run --project windows/tests/Inlaut.SimulationSmoke -c Release

      - name: Windows UI, hotkey cancellation and delayed clipboard target
        timeout-minutes: 3
        run: dotnet run --project windows/tests/Inlaut.UiSmoke -c Release -- --paste --transitions

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Compiler checksum mismatch' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'inno'
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS', "/DIR=`"$compilerDir`"") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Compiler installation failed: $($process.ExitCode)" }

      - name: Build verified app and per-user beta installer
        shell: pwsh
        run: ./windows/installer/Build-Beta.ps1 -OutputDirectory ./publish/beta -CompilerPath "$env:RUNNER_TEMP/inno/ISCC.exe"

      - name: English model inference regression
        run: dotnet run --project windows/tests/Inlaut.UiSmoke -c Release -- --english-model publish/beta/app/models/fastconformer-en publish/beta/sherpa-onnx-nemo-fast-conformer-transducer-en-24500-int8/test_wavs/0.wav

      - name: Verify clean beta installation and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content windows/src/Inlaut.App/Inlaut.App.csproj -Raw)).Project.PropertyGroup.Version
          $installer = (Resolve-Path "publish/beta/inlaut-$version-windows-x64-setup.exe").Path
          $payload = (Resolve-Path 'publish/beta/app').Path
          $installDirectory = Join-Path $env:RUNNER_TEMP ('inlaut beta install ' + [Guid]::NewGuid().ToString('N'))
          $installLog = Join-Path $env:RUNNER_TEMP 'inlaut-beta-install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'inlaut-beta-uninstall.log'
          try {
            $process = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installDirectory`"", "/LOG=`"$installLog`"") -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Beta installation failed: $($process.ExitCode)" }
            $files = @('Inlaut.exe', 'Inlaut.UpdateHost.exe', 'LICENSE', 'BETA.md')
            foreach ($directory in @('models', 'licenses')) {
              $files += Get-ChildItem -LiteralPath (Join-Path $payload $directory) -Recurse -File | ForEach-Object { [IO.Path]::GetRelativePath($payload, $_.FullName) }
            }
            if (-not (Test-Path -LiteralPath (Join-Path $installDirectory 'licenses/nuget-packages.json'))) { throw 'Dependency notices were not installed.' }
            foreach ($relative in $files) {
              $expected = (Get-FileHash -LiteralPath (Join-Path $payload $relative) -Algorithm SHA256).Hash
              $actual = (Get-FileHash -LiteralPath (Join-Path $installDirectory $relative) -Algorithm SHA256).Hash
              if ($actual -ne $expected) { throw "Installed file differs from payload: $relative" }
            }
            Write-Output "Clean installer verified $($files.Count) executables, models and license/document files."
          } finally {
            $uninstaller = Join-Path $installDirectory 'unins000.exe'
            if (Test-Path -LiteralPath $uninstaller) {
              $process = Start-Process $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$uninstallLog`"") -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "Beta uninstall failed: $($process.ExitCode)" }
            }
          }
          if (Test-Path -LiteralPath (Join-Path $installDirectory 'Inlaut.exe')) { throw 'Uninstall left the installed application behind.' }

      - name: Verify update over the published beta.9
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content windows/src/Inlaut.App/Inlaut.App.csproj -Raw)).Project.PropertyGroup.Version
          $installer = (Resolve-Path "publish/beta/inlaut-$version-windows-x64-setup.exe").Path
          $payload = (Resolve-Path 'publish/beta/app').Path
          # The last .NET 8 release, pinned so the test never runs a changed download.
          $previous = Join-Path $env:RUNNER_TEMP 'inlaut-0.7.0-beta.9-windows-x64-setup.exe'
          Invoke-WebRequest 'https://github.com/tobymarks/inlaut/releases/download/windows-v0.7.0-beta.9/inlaut-0.7.0-beta.9-windows-x64-setup.exe' -OutFile $previous
          if ((Get-FileHash $previous -Algorithm SHA256).Hash -ne 'D7EFCE35E76DEAC5AC570B416B9CE4A3E0950CA995DA52C1BC214134C70D8A61') { throw 'beta.9 installer checksum mismatch' }
          # A folder the user chose, with a space: the update runs without /DIR and has to find it.
          $app = Join-Path $env:RUNNER_TEMP 'inlaut chosen folder'
          $default = Join-Path $env:LOCALAPPDATA 'Programs\inlaut Beta'
          $data = Join-Path $env:LOCALAPPDATA 'inlaut'
          $settings = Join-Path $data 'settings.json'
          $saved = Join-Path $env:RUNNER_TEMP 'inlaut-settings-saved.json'
          foreach ($folder in @($app, $default)) { if (Test-Path -LiteralPath $folder) { throw "Install folder already exists: $folder" } }
          function Install([string]$setup, [string]$log, [string[]]$extra = @()) {
            $process = Start-Process $setup -ArgumentList (@('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/LOG=`"$log`"") + $extra) -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installation failed: $setup ($($process.ExitCode))" }
          }
          function Files([string]$root) {
            Get-ChildItem -LiteralPath $root -Recurse -File | ForEach-Object { [IO.Path]::GetRelativePath($root, $_.FullName) }
          }
          function SameHash([string]$a, [string]$b) {
            (Get-FileHash -LiteralPath $a -Algorithm SHA256).Hash -eq (Get-FileHash -LiteralPath $b -Algorithm SHA256).Hash
          }
          # Settings as beta.9 saves them, with a replacement and a snippet.
          function SaveSettings([string]$language) {
            New-Item -ItemType Directory -Force $data | Out-Null
            [ordered]@{
              SpeechLanguage = $language; InterfaceLanguage = 'de'; TriggerVkCode = 163; TriggerKeyName = 'Strg rechts'
              HoldDelayMs = 300; DoubleTapWindowMs = 450; UseClipboardInsertion = $false; VoiceCommands = $true
              SharpS = $false; MicrophoneId = ''; PlaySounds = $false; LaunchAtLogin = $false
              AutomaticUpdates = $false; UpdateConsentAsked = $true; BetaUpdates = $true
              IndicatorPosition = 'top'; TriggerMode = 'hold'
              Replacements = @([ordered]@{ From = 'Strasse'; To = 'Str.' })
              Snippets = @([ordered]@{ Phrase = 'meine Adresse'; Text = "Musterweg 1`n12345 Musterstadt" })
            } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $settings -Encoding utf8
            Copy-Item -LiteralPath $settings $saved -Force
          }
          # Start the updated app as a user would and wait until it has loaded the model the settings ask for.
          function StartAndCheck([string]$language) {
            Remove-Item -LiteralPath (Join-Path $data 'diagnostics'), (Join-Path $data 'crash-reports') -Recurse -Force -ErrorAction SilentlyContinue
            $diagnostics = Join-Path $data 'diagnostics/latest.jsonl'
            $expected = @(Get-ChildItem -LiteralPath (Join-Path $payload "models/fastconformer-$language") -File |
              Where-Object { $_.Name -like '*.onnx' -or $_.Name -eq 'tokens.txt' } | ForEach-Object { "$($_.Name)=$($_.Length)" } | Sort-Object)
            $process = Start-Process (Join-Path $app 'Inlaut.exe') -PassThru
            try {
              $ready = $null
              $deadline = (Get-Date).AddSeconds(120)
              while (-not $ready -and (Get-Date) -lt $deadline) {
                if ($process.HasExited) { throw "The updated app quit while starting: $($process.ExitCode)" }
                Start-Sleep -Seconds 1
                try {
                  if (Test-Path -LiteralPath $diagnostics) {
                    $ready = Get-Content -LiteralPath $diagnostics | ForEach-Object { $_ | ConvertFrom-Json } |
                      Where-Object { $_.stage -eq 'model-ready' } | Select-Object -First 1
                  }
                } catch { } # The app may be writing the line right now.
              }
              if (-not $ready) { throw 'The updated app did not load its model within 120 seconds.' }
              if ($ready.version.Split('+')[0] -cne $version) { throw "The model was loaded by $($ready.version)" }
              $loaded = @($ready.metrics.files | ForEach-Object { "$($_.name)=$($_.bytes)" } | Sort-Object)
              if (($loaded -join ';') -cne ($expected -join ';')) { throw "The updated app did not load the '$language' model its saved settings ask for." }
              Start-Sleep -Seconds 5
              if ($process.HasExited) { throw "The updated app quit after loading its model: $($process.ExitCode)" }
              if (Test-Path -LiteralPath (Join-Path $data 'crash-reports/fault.json')) { throw 'The updated app recorded an unhandled exception.' }
            } finally {
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force; $process.WaitForExit() }
            }
            if (-not (SameHash $saved $settings)) { throw 'The updated app changed the saved settings.' }
          }

          Install $previous (Join-Path $env:RUNNER_TEMP 'inlaut-update-beta9.log') @("/DIR=`"$app`"")
          $shipped = @(Files $payload)
          $dropped = @(Files $app | Where-Object { $_ -notin $shipped -and $_ -notlike 'unins000.*' })
          if ($dropped.Count -eq 0) { throw 'beta.9 installed no file that this build drops, so the test proves nothing.' }
          SaveSettings 'en'

          Install $installer (Join-Path $env:RUNNER_TEMP 'inlaut-update-beta10.log')
          if (Test-Path -LiteralPath $default) { throw "The update ignored the existing folder and installed into $default" }
          $product = [Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $app 'Inlaut.exe')).ProductVersion
          if ($product.Split('+')[0] -cne $version) { throw "The update did not replace the app in its folder: $product" }
          $left = @(Files $app | Where-Object { $_ -notin $shipped -and $_ -notlike 'unins000.*' })
          if ($left.Count -gt 0) { throw "The update left files of beta.9 behind: $($left -join ', ')" }
          foreach ($relative in $shipped) {
            if (-not (SameHash (Join-Path $payload $relative) (Join-Path $app $relative))) { throw "Updated file differs from payload: $relative" }
          }
          if (-not (SameHash $saved $settings)) { throw 'The update changed the settings file.' }

          # Without a settings file the app picks English on a non-German Windows and German on
          # a German one; a file it cannot read gives German. Only a file the app finds and reads
          # passes both starts.
          StartAndCheck 'en'
          SaveSettings 'de'
          StartAndCheck 'de'

          $process = Start-Process (Join-Path $app 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$(Join-Path $env:RUNNER_TEMP 'inlaut-update-uninstall.log')`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstall after the update failed: $($process.ExitCode)" }
          if (Test-Path -LiteralPath (Join-Path $app 'Inlaut.exe')) { throw 'Uninstall left the updated application behind.' }
          if (-not (SameHash $saved $settings)) { throw 'Uninstall changed the saved settings.' }
          Write-Output "The update over beta.9 found its folder, removed all $($dropped.Count) files this build no longer ships, kept the settings, and the app started with the English and then the German model they select."

      - name: Upload UI regression screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ui-localizations
          path: windows/tests/Inlaut.UiSmoke/bin/Release/net10.0-windows/*.png

      - name: Verify signing metadata and unsigned-package rejection
        shell: pwsh
        run: |
          $version = ([xml](Get-Content windows/src/Inlaut.App/Inlaut.App.csproj -Raw)).Project.PropertyGroup.Version
          $names = @('Inlaut.exe', 'Inlaut.dll', 'Inlaut.Core.dll', 'Inlaut.Platform.Windows.dll', 'Inlaut.UpdateHost.exe')
          foreach ($name in $names) {
            $path = (Resolve-Path "publish/beta/app/$name").Path
            $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($path)
            if ($info.ProductName -cne 'inlaut' -or $info.ProductVersion -cne $version) { throw "Signing metadata mismatch: $name" }
          }
          $installer = (Resolve-Path "publish/beta/inlaut-$version-windows-x64-setup.exe").Path
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($installer)
          # Inno Setup pads version-resource strings with ASCII spaces.
          if ($info.ProductName.TrimEnd([char]' ') -cne 'inlaut' -or $info.ProductVersion.TrimEnd([char]' ') -cne $version) { throw 'Installer signing metadata mismatch' }
          $rejected = $false
          try {
            ./windows/signing/Assert-SignedFiles.ps1 -Directory publish/beta/app -Names @('Inlaut.exe') -Version $version -CertificateSha256 ('0' * 64)
          } catch {
            if ($_.Exception.Message -notlike 'Invalid Authenticode signature:*') { throw }
            $rejected = $true
          }
          if (-not $rejected) { throw 'Unsigned application was accepted by release verification' }

      - name: Record release build provenance
        shell: pwsh
        run: |
          @(
            'inlaut Windows — unsigned beta, manual installation only'
            "Source commit: $env:GITHUB_SHA"
            "Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content -LiteralPath publish/beta/BUILD.txt -Encoding utf8

      - name: Upload release installer and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inlaut-windows-release
          path: |
            publish/beta/inlaut-*-windows-x64-setup.exe
            publish/beta/SHA256SUMS.txt
            publish/beta/BUILD.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload app and installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inlaut-windows-beta
          path: publish/beta/
          retention-days: 14
