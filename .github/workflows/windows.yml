name: Windows Build

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - '.gitattributes'
      - 'global.json'
      - 'TestData/**'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - '.gitattributes'
      - 'global.json'
      - 'TestData/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build inlaut Windows App & Models
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          dotnet --info
          dotnet restore windows/Inlaut.sln

      - name: Build Solution
        run: dotnet build windows/Inlaut.sln -c Release --no-restore

      - name: Text preservation regression
        run: dotnet run --project windows/tests/Inlaut.CoreSmoke -c Release

      - name: Simulated dictation and failure recovery
        run: dotnet run --project windows/tests/Inlaut.SimulationSmoke -c Release

      - name: Windows UI, hotkey cancellation and delayed clipboard target
        timeout-minutes: 3
        run: dotnet run --project windows/tests/Inlaut.UiSmoke -c Release -- --paste --transitions

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Compiler checksum mismatch' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'inno'
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS', "/DIR=`"$compilerDir`"") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Compiler installation failed: $($process.ExitCode)" }

      - name: Build verified app and per-user beta installer
        shell: pwsh
        run: ./windows/installer/Build-Beta.ps1 -OutputDirectory ./publish/beta -CompilerPath "$env:RUNNER_TEMP/inno/ISCC.exe"

      - name: English model inference regression
        run: dotnet run --project windows/tests/Inlaut.UiSmoke -c Release -- --english-model publish/beta/app/models/fastconformer-en publish/beta/sherpa-onnx-nemo-fast-conformer-transducer-en-24500-int8/test_wavs/0.wav

      - name: Verify clean beta installation and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content windows/src/Inlaut.App/Inlaut.App.csproj -Raw)).Project.PropertyGroup.Version
          $installer = (Resolve-Path "publish/beta/inlaut-$version-windows-x64-setup.exe").Path
          $payload = (Resolve-Path 'publish/beta/app').Path
          $installDirectory = Join-Path $env:RUNNER_TEMP ('inlaut beta install ' + [Guid]::NewGuid().ToString('N'))
          $installLog = Join-Path $env:RUNNER_TEMP 'inlaut-beta-install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'inlaut-beta-uninstall.log'
          try {
            $process = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installDirectory`"", "/LOG=`"$installLog`"") -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Beta installation failed: $($process.ExitCode)" }
            $files = @('Inlaut.exe', 'Inlaut.UpdateHost.exe', 'LICENSE', 'BETA.md')
            foreach ($directory in @('models', 'licenses')) {
              $files += Get-ChildItem -LiteralPath (Join-Path $payload $directory) -Recurse -File | ForEach-Object { [IO.Path]::GetRelativePath($payload, $_.FullName) }
            }
            if (-not (Test-Path -LiteralPath (Join-Path $installDirectory 'licenses/nuget-packages.json'))) { throw 'Dependency notices were not installed.' }
            foreach ($relative in $files) {
              $expected = (Get-FileHash -LiteralPath (Join-Path $payload $relative) -Algorithm SHA256).Hash
              $actual = (Get-FileHash -LiteralPath (Join-Path $installDirectory $relative) -Algorithm SHA256).Hash
              if ($actual -ne $expected) { throw "Installed file differs from payload: $relative" }
            }
            Write-Output "Clean installer verified $($files.Count) executables, models and license/document files."
          } finally {
            $uninstaller = Join-Path $installDirectory 'unins000.exe'
            if (Test-Path -LiteralPath $uninstaller) {
              $process = Start-Process $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$uninstallLog`"") -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "Beta uninstall failed: $($process.ExitCode)" }
            }
          }
          if (Test-Path -LiteralPath (Join-Path $installDirectory 'Inlaut.exe')) { throw 'Uninstall left the installed application behind.' }

      - name: Upload UI regression screenshots
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-localizations
          path: windows/tests/Inlaut.UiSmoke/bin/Release/net8.0-windows/*.png

      - name: Verify signing metadata and unsigned-package rejection
        shell: pwsh
        run: |
          $version = ([xml](Get-Content windows/src/Inlaut.App/Inlaut.App.csproj -Raw)).Project.PropertyGroup.Version
          $names = @('Inlaut.exe', 'Inlaut.dll', 'Inlaut.Core.dll', 'Inlaut.Platform.Windows.dll', 'Inlaut.UpdateHost.exe')
          foreach ($name in $names) {
            $path = (Resolve-Path "publish/beta/app/$name").Path
            $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($path)
            if ($info.ProductName -cne 'inlaut' -or $info.ProductVersion -cne $version) { throw "Signing metadata mismatch: $name" }
          }
          $installer = (Resolve-Path "publish/beta/inlaut-$version-windows-x64-setup.exe").Path
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($installer)
          # Inno Setup pads version-resource strings with ASCII spaces.
          if ($info.ProductName.TrimEnd([char]' ') -cne 'inlaut' -or $info.ProductVersion.TrimEnd([char]' ') -cne $version) { throw 'Installer signing metadata mismatch' }
          $rejected = $false
          try {
            ./windows/signing/Assert-SignedFiles.ps1 -Directory publish/beta/app -Names @('Inlaut.exe') -Version $version -CertificateSha256 ('0' * 64)
          } catch {
            if ($_.Exception.Message -notlike 'Invalid Authenticode signature:*') { throw }
            $rejected = $true
          }
          if (-not $rejected) { throw 'Unsigned application was accepted by release verification' }

      - name: Record release build provenance
        shell: pwsh
        run: |
          @(
            'inlaut Windows — unsigned beta, manual installation only'
            "Source commit: $env:GITHUB_SHA"
            "Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content -LiteralPath publish/beta/BUILD.txt -Encoding utf8

      - name: Upload release installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: inlaut-windows-release
          path: |
            publish/beta/inlaut-*-windows-x64-setup.exe
            publish/beta/SHA256SUMS.txt
            publish/beta/BUILD.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload app and installer
        uses: actions/upload-artifact@v4
        with:
          name: inlaut-windows-beta
          path: publish/beta/
          retention-days: 14
