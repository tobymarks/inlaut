# Generate the Xcode project with: xcodegen generate
name: Dictate
options:
  bundleIdPrefix: de.tobymarks
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7V4K87652E
    CODE_SIGN_STYLE: Manual
    # A stable signature keeps the Accessibility grant across rebuilds.
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Dictate:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tobymarks.dictate
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Dictate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Dictate hört nur zu, solange du die Tastenkombination nutzt. Die Aufnahme wird auf diesem Mac in Text umgewandelt und verlässt ihn nicht.
        NSSpeechRecognitionUsageDescription: Dictate wandelt deine Sprache mit der Spracherkennung von macOS auf diesem Mac in Text um.
    entitlements:
      path: Resources/Dictate.entitlements
      properties:
        com.apple.security.device.audio-input: true
