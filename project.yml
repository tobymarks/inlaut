# Generate the Xcode project with: xcodegen generate
name: Inlaut
options:
  bundleIdPrefix: de.tobymarks
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  # English source strings; German comes from the String Catalogs.
  developmentLanguage: en
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # FluidAudio (Core ML speech recognition), pinned and without its default
  # NemoTextProcessing trait; see Packages/InlautSpeech/Package.swift.
  InlautSpeech:
    path: Packages/InlautSpeech
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: 7V4K87652E
    CODE_SIGN_STYLE: Manual
    # A stable signature keeps the Accessibility grant across rebuilds.
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ARCHS: arm64
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  configs:
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
targets:
  InlautTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/TextInserter.swift
      - Sources/VoiceCommands.swift
      - Sources/Replacements.swift
      - Sources/SharpS.swift
      - Sources/CancellationFlag.swift
      - Sources/Recorder.swift
      - Sources/TranscriptionEngine.swift
      - Sources/ManagedSession.swift
      - Sources/ModelStore.swift
      - Sources/RecordingIndicator.swift
      - Sources/InlautColors.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.tobymarks.inlaut.tests
  Inlaut:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
      - path: Resources/InfoPlist.xcstrings
      # Native Icon Composer document using the brand kit's unmasked vector layer.
      - path: Resources/Inlaut.icon
        buildPhase: resources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - package: InlautSpeech
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tobymarks.inlaut
        ASSETCATALOG_COMPILER_APPICON_NAME: Inlaut
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: inlaut
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: inlaut only listens while you use the shortcut. The recording is turned into text on this Mac and never leaves it.
        NSSpeechRecognitionUsageDescription: inlaut turns your speech into text on this Mac with the macOS speech recognition.
        SUFeedURL: https://inlaut.de/updates/appcast.xml
        SUPublicEDKey: 0BXRecMp8/xobMyn1LWMXUlWzRNC5JDPlwC48CwzqwU=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        SUEnableSystemProfiling: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    entitlements:
      path: Resources/Inlaut.entitlements
      properties:
        com.apple.security.device.audio-input: true
schemes:
  Inlaut:
    build:
      targets:
        Inlaut: all
        InlautTests: [test]
    test:
      targets:
        - InlautTests
