# Generate the Xcode project with: xcodegen generate
name: Inlaut
options:
  bundleIdPrefix: de.tobymarks
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7V4K87652E
    CODE_SIGN_STYLE: Manual
    # A stable signature keeps the Accessibility grant across rebuilds.
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ARCHS: arm64
  configs:
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
targets:
  InlautTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/TextInserter.swift
      - Sources/VoiceCommands.swift
      - Sources/Replacements.swift
      - Sources/CancellationFlag.swift
      - Sources/Recorder.swift
      - Sources/TranscriptionEngine.swift
      - Sources/ManagedSession.swift
      - Sources/RecordingIndicator.swift
      - Sources/InlautColors.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.tobymarks.inlaut.tests
  Inlaut:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
      # Native Icon Composer document using the brand kit's unmasked vector layer.
      - path: Resources/Inlaut.icon
        buildPhase: resources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    # Run scripts/fetch-sherpa-onnx.sh once before the first build.
    dependencies:
      - package: Sparkle
      - framework: Vendor/sherpa-onnx/lib/libsherpa-onnx-c-api.dylib
        embed: true
        codeSign: true
      - framework: Vendor/sherpa-onnx/lib/libonnxruntime.dylib
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tobymarks.inlaut
        ASSETCATALOG_COMPILER_APPICON_NAME: Inlaut
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Vendor/sherpa-onnx/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/sherpa-onnx/lib
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: inlaut
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: inlaut hört nur zu, solange du die Tastenkombination nutzt. Die Aufnahme wird auf diesem Mac in Text umgewandelt und verlässt ihn nicht.
        NSSpeechRecognitionUsageDescription: inlaut wandelt deine Sprache mit der Spracherkennung von macOS auf diesem Mac in Text um.
        SUFeedURL: https://inlaut.de/updates/appcast.xml
        SUPublicEDKey: 0BXRecMp8/xobMyn1LWMXUlWzRNC5JDPlwC48CwzqwU=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        SUEnableSystemProfiling: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    entitlements:
      path: Resources/Inlaut.entitlements
      properties:
        com.apple.security.device.audio-input: true
schemes:
  Inlaut:
    build:
      targets:
        Inlaut: all
        InlautTests: [test]
    test:
      targets:
        - InlautTests
