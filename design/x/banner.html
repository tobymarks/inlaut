<!doctype html>
<meta charset="utf-8">
<!-- X header, 1500x500 (rendered at 2x). The avatar covers the bottom left
     corner and X crops a little off top and bottom, so the content sits in
     the middle band. -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1500px; height: 500px; overflow: hidden; }
body { background: radial-gradient(ellipse 1100px 520px at 50% 50%, #174B48 0%, #103D3B 60%, #0C201F 130%);
  font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased; color: #F6F7F4; }
.safe { position: absolute; left: 190px; right: 150px; top: 90px; height: 280px;
  display: flex; align-items: center; justify-content: space-between; }
.safe img { height: 118px; }
.text { text-align: right; }
h1 { font-size: 54px; line-height: 1.1; font-weight: 600; letter-spacing: -0.035em; }
h1 em { font-style: normal; color: #BCEBD9; }
p { margin-top: 18px; font-size: 27px; font-weight: 500; color: #A5BCB6; letter-spacing: -0.01em; }
p b { color: #BCEBD9; font-weight: 600; }
</style>
<div class="safe">
  <img src="../inlaut-brand-kit/logo/inlaut-logo-mint.svg" alt="">
  <div class="text">
    <h1>Diktieren am Mac.<br><em>Lokal, ohne Cloud.</em></h1>
    <p>Kostenlos und Open Source · <b>inlaut.de</b></p>
  </div>
</div>
