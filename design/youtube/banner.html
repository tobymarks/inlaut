<!doctype html>
<meta charset="utf-8">
<!-- YouTube channel banner, 2560x1440. Everything that matters sits in the
     1546x423 safe area in the middle; the rest only shows on TVs. -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 2560px; height: 1440px; overflow: hidden; }
body { background: radial-gradient(ellipse 1500px 900px at 50% 50%, #174B48 0%, #103D3B 60%, #0C201F 130%);
  font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased; color: #F6F7F4; }
.safe { position: absolute; left: 507px; top: 508px; width: 1546px; height: 423px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 70px; }
.safe img { height: 150px; }
.text { text-align: right; }
h1 { font-size: 66px; line-height: 1.1; font-weight: 600; letter-spacing: -0.035em; }
h1 em { font-style: normal; color: #BCEBD9; }
p { margin-top: 22px; font-size: 34px; font-weight: 500; color: #A5BCB6; letter-spacing: -0.01em; }
p b { color: #BCEBD9; font-weight: 600; }
</style>
<div class="safe">
  <img src="../inlaut-brand-kit/logo/inlaut-logo-mint.svg" alt="">
  <div class="text">
    <h1>Diktieren am Mac.<br><em>Lokal, ohne Cloud.</em></h1>
    <p>Kostenlos und Open Source · <b>inlaut.de</b></p>
  </div>
</div>
